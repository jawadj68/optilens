{% extends "optilens/base.html" %}
{% block browser_tab %}Patients{% endblock %}
{% block page_title %}Patients{% endblock %}
{% block content %}
{% include "optilens/_nav.html" %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-2">
  <div class="flex-grow-1" style="max-width: 32rem;">
    <label class="form-label small text-muted mb-1" for="patient-search">Recherche (filtre en direct)</label>
    <input
      type="search"
      id="patient-search"
      class="form-control"
      value="{{ q }}"
      placeholder="Nom, Nb, téléphone, adresse, région…"
      autocomplete="off"
    >
  </div>
  <a class="btn btn-success align-self-end" href="{% url 'optilens:patient_create' %}"><i class="bi bi-person-plus"></i> Nouveau</a>
</div>
<div class="card shadow-sm">
  <div class="card-body p-3" id="patient-list-results">
    {% include "optilens/patient_list_results.html" %}
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("patient-search");
  const panel = document.getElementById("patient-list-results");
  if (!input || !panel) return;

  let timer = null;
  let page = 1;

  function fetchResults() {
    const q = input.value.trim();
    const params = new URLSearchParams({ partial: "1", q: q });
    if (page > 1) params.set("page", String(page));
    fetch("{% url 'optilens:patient_list' %}?" + params.toString(), {
      headers: { "X-Requested-With": "XMLHttpRequest" },
    })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        panel.innerHTML = html;
        bindPagination();
      });
  }

  function bindPagination() {
    panel.querySelectorAll(".patient-page-link").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        page = parseInt(a.dataset.page, 10) || 1;
        fetchResults();
      });
    });
  }

  input.addEventListener("input", function () {
    page = 1;
    clearTimeout(timer);
    timer = setTimeout(fetchResults, 250);
  });

  bindPagination();
});
</script>
{% endblock %}
